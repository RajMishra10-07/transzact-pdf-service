<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="djangoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#092e20"/>
      <stop offset="100%" stop-color="#1b4d3e"/>
    </linearGradient>
    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="workerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="queueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="storageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4ade80"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fbbf24"/>
    </marker>

    <!-- Filter for soft shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="50" y="45" fill="#f8fafc" font-size="24" font-weight="700">Production-Oriented PDF Microservice Architecture</text>
  <text x="50" y="70" fill="#94a3b8" font-size="14">Decoupled Asynchronous Processing, Memory Isolation, Snapshot Consistency &amp; Tamper Verification</text>

  <!-- Legend -->
  <rect x="830" y="25" width="320" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <line x1="845" y1="45" x2="880" y2="45" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="890" y="49" fill="#cbd5e1" font-size="11">Asynchronous Queued Event</text>
  <line x1="845" y1="65" x2="880" y2="65" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="890" y="69" fill="#cbd5e1" font-size="11">Synchronous HTTP / Direct I/O</text>

  <!-- 1. DJANGO CLIENT -->
  <g filter="url(#shadow)">
    <rect x="50" y="110" width="280" height="150" rx="10" fill="url(#djangoGrad)" stroke="#22c55e" stroke-width="2"/>
    <text x="70" y="145" fill="#4ade80" font-size="18" font-weight="700">Django Monolith ERP</text>
    <text x="70" y="170" fill="#e2e8f0" font-size="12">• Host: EC2 r6i.large (Existing)</text>
    <text x="70" y="190" fill="#e2e8f0" font-size="12">• Client: Single &amp; Bulk PDF Generation</text>
    <text x="70" y="210" fill="#e2e8f0" font-size="12">• Downloads PDFs &amp; Bulk ZIP Archives</text>
    <text x="70" y="230" fill="#e2e8f0" font-size="12">• SSE Live Progress Client</text>
  </g>

  <!-- 2. API GATEWAY / EXPRESS -->
  <g filter="url(#shadow)">
    <rect x="440" y="110" width="380" height="230" rx="10" fill="url(#apiGrad)" stroke="#38bdf8" stroke-width="2"/>
    <text x="460" y="145" fill="#38bdf8" font-size="18" font-weight="700">Express API Microservice</text>
    <text x="460" y="170" fill="#e2e8f0" font-size="12">• Auth: API Key + Django Shared Secret Header</text>
    <text x="460" y="190" fill="#e2e8f0" font-size="12">• Tenant Isolation &amp; Token-Bucket Rate Limiter</text>
    <text x="460" y="210" fill="#e2e8f0" font-size="12">• Zod Schema Validation &amp; 100-Doc Limit</text>
    <text x="460" y="230" fill="#facc15" font-size="12" font-weight="600">• Snapshot Hashing (Canonical deep JSON SHA-256)</text>
    <text x="460" y="250" fill="#e2e8f0" font-size="12">• Dual-Mode Routing (Sync Fallback vs 202 Async)</text>
    <text x="460" y="270" fill="#e2e8f0" font-size="12">• SSE Broadcaster (Heartbeats &amp; Reconnection)</text>
    <text x="460" y="290" fill="#e2e8f0" font-size="12">• Resumable Downloads (HTTP Range 206)</text>
    <text x="460" y="315" fill="#94a3b8" font-size="11">Endpoints: /documents/generate, /bulk, /ready, /metrics</text>
  </g>

  <!-- Line: Django to API -->
  <path d="M 330 185 L 435 185" fill="none" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="345" y="175" fill="#86efac" font-size="10" font-weight="600">REST (JSON)</text>

  <!-- 3. POSTGRESQL METADATA -->
  <g filter="url(#shadow)">
    <rect x="50" y="330" width="280" height="240" rx="10" fill="url(#dbGrad)" stroke="#0ea5e9" stroke-width="2"/>
    <text x="70" y="365" fill="#38bdf8" font-size="18" font-weight="700">PostgreSQL 16 (RDS)</text>
    <text x="70" y="390" fill="#cbd5e1" font-size="12" font-weight="600">Durable Metadata &amp; Snapshots:</text>
    <text x="70" y="410" fill="#e2e8f0" font-size="11">• generation_jobs (input_hash, payload)</text>
    <text x="70" y="430" fill="#e2e8f0" font-size="11">• documents (sha256, storage_key)</text>
    <text x="70" y="450" fill="#e2e8f0" font-size="11">• bulk_jobs (progress counters)</text>
    <text x="70" y="470" fill="#e2e8f0" font-size="11">• bulk_job_items (per-doc tracking)</text>
    <text x="70" y="490" fill="#facc15" font-size="11" font-weight="600">• document_audit_records</text>
    <text x="70" y="510" fill="#94a3b8" font-size="10">  (Append-only verification log)</text>
    <text x="70" y="540" fill="#cbd5e1" font-size="11">Shared with Django (zero duplicate fee)</text>
  </g>

  <!-- Line: API to Postgres -->
  <path d="M 440 280 L 335 370" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="350" y="315" fill="#38bdf8" font-size="10" font-weight="600">Persist Snapshot</text>

  <!-- 4. REDIS & BULLMQ -->
  <g filter="url(#shadow)">
    <rect x="910" y="110" width="240" height="230" rx="10" fill="url(#queueGrad)" stroke="#ef4444" stroke-width="2"/>
    <text x="930" y="145" fill="#f87171" font-size="18" font-weight="700">Redis 7 &amp; BullMQ</text>
    <text x="930" y="175" fill="#e2e8f0" font-size="12">• Dedicated Queues:</text>
    <text x="940" y="195" fill="#fca5a5" font-size="11">1. pdf-render-normal</text>
    <text x="940" y="215" fill="#fca5a5" font-size="11">2. pdf-render-large</text>
    <text x="940" y="235" fill="#fca5a5" font-size="11">3. bulk-archive-creation</text>
    <text x="930" y="260" fill="#e2e8f0" font-size="12">• Bounded Retries (Max 3)</text>
    <text x="930" y="280" fill="#e2e8f0" font-size="12">• Exponential Backoff</text>
    <text x="930" y="300" fill="#e2e8f0" font-size="12">• Idempotent Job Deduplication</text>
    <text x="930" y="320" fill="#e2e8f0" font-size="12">• Memory: No PDFs in Redis!</text>
  </g>

  <!-- Line: API to BullMQ -->
  <path d="M 820 185 L 905 185" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="835" y="175" fill="#38bdf8" font-size="10" font-weight="600">Enqueue Job</text>

  <!-- 5. WORKERS CONTAINER / CLUSTER -->
  <g filter="url(#shadow)">
    <rect x="440" y="400" width="710" height="230" rx="10" fill="url(#workerGrad)" stroke="#818cf8" stroke-width="2"/>
    <text x="460" y="430" fill="#a5b4fc" font-size="18" font-weight="700">Dedicated Worker Pool (Memory-Isolated)</text>

    <!-- Normal Worker Sub-box -->
    <rect x="460" y="450" width="210" height="160" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="475" y="475" fill="#c7d2fe" font-size="14" font-weight="700">Normal Doc Worker</text>
    <text x="475" y="500" fill="#e2e8f0" font-size="11">• Concurrency: 3</text>
    <text x="475" y="520" fill="#e2e8f0" font-size="11">• Items: &lt; 150 items</text>
    <text x="475" y="540" fill="#e2e8f0" font-size="11">• Browser pool recycling</text>
    <text x="475" y="560" fill="#e2e8f0" font-size="11">• Direct disk/S3 streaming</text>
    <text x="475" y="580" fill="#e2e8f0" font-size="11">• Timeout: 15 seconds</text>

    <!-- Large Worker Sub-box -->
    <rect x="690" y="450" width="220" height="160" rx="6" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="705" y="475" fill="#fde68a" font-size="14" font-weight="700">Large Doc Worker</text>
    <text x="705" y="500" fill="#e2e8f0" font-size="11">• Strict Concurrency: 1</text>
    <text x="705" y="520" fill="#e2e8f0" font-size="11">• Items: 150 - 800 items</text>
    <text x="705" y="540" fill="#e2e8f0" font-size="11">• Dedicated RAM headroom</text>
    <text x="705" y="560" fill="#e2e8f0" font-size="11">• Safe error on &gt; 800 items</text>
    <text x="705" y="580" fill="#e2e8f0" font-size="11">• No worker crash on OOM</text>

    <!-- Bulk Archive Worker Sub-box -->
    <rect x="930" y="450" width="200" height="160" rx="6" fill="#1e1b4b" stroke="#ec4899" stroke-width="1.5"/>
    <text x="945" y="475" fill="#fbcfe8" font-size="14" font-weight="700">Archive Worker</text>
    <text x="945" y="500" fill="#e2e8f0" font-size="11">• Concurrency: 2</text>
    <text x="945" y="520" fill="#e2e8f0" font-size="11">• Awaits batch finish</text>
    <text x="945" y="540" fill="#e2e8f0" font-size="11">• Streaming archiver (ZIP)</text>
    <text x="945" y="560" fill="#e2e8f0" font-size="11">• Injects manifest.json</text>
    <text x="945" y="580" fill="#e2e8f0" font-size="11">• Emits SSE completion</text>
  </g>

  <!-- Line: BullMQ to Workers -->
  <path d="M 1030 340 L 1030 395" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <!-- 6. OBJECT STORAGE LAYER -->
  <g filter="url(#shadow)">
    <rect x="440" y="690" width="710" height="160" rx="10" fill="url(#storageGrad)" stroke="#c084fc" stroke-width="2"/>
    <text x="460" y="725" fill="#d8b4fe" font-size="18" font-weight="700">Durable Object Storage (AWS S3 / Local Dev MinIO)</text>
    <text x="460" y="755" fill="#e2e8f0" font-size="12">• Deterministic Paths: tenants/{tenantId}/documents/{type}/{id}-v1.pdf</text>
    <text x="460" y="775" fill="#e2e8f0" font-size="12">• Bulk Archives: tenants/{tenantId}/bulk/{bulkJobId}/archive.zip</text>
    <text x="460" y="795" fill="#e2e8f0" font-size="12">• Short-Lived Pre-Signed URLs (3,600s) &amp; HTTP Range 206 for Unstable Mobile Networks</text>
    <text x="460" y="815" fill="#facc15" font-size="12" font-weight="600">• Tamper Detection: SHA-256 Checksum Verified on Stored File Before Serving Download</text>
  </g>

  <!-- Line: Workers to Storage -->
  <path d="M 795 630 L 795 685" fill="none" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="805" y="660" fill="#86efac" font-size="11" font-weight="600">Save PDF / ZIP Stream</text>

  <!-- Line: Storage to Django (Download) -->
  <path d="M 440 760 L 220 760 L 220 260" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="230" y="745" fill="#fde047" font-size="11" font-weight="600">Resumable Direct Download (PDF / ZIP)</text>
</svg>
