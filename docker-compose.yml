version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: transzact-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: transzact_pdf
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d transzact_pdf"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: transzact-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: transzact-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  minio-create-bucket:
    image: minio/mc:RELEASE.2024-01-16T16-06-34Z
    container_name: transzact-minio-create-bucket
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadminpassword;
      /usr/bin/mc mb --ignore-existing local/transzact-pdf-documents;
      exit 0;
      "

  api:
    build:
      context: .
      target: production
    container_name: transzact-pdf-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      NODE_ENV: production
      LOG_LEVEL: info
      API_KEY: compose-prod-m2m-secure-key-928471049281
      JWT_SECRET: compose-prod-jwt-secret-key-8193810294819203819284
      DEV_AUTH_BYPASS: "false"
      STORAGE_DRIVER: s3
      AWS_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadminpassword
      AWS_S3_BUCKET: transzact-pdf-documents
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_FORCE_PATH_STYLE: "true"
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/transzact_pdf
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1024M

  worker-normal:
    build:
      context: .
      target: production
    container_name: transzact-worker-normal
    restart: unless-stopped
    command: ["npm", "run", "start:worker"]
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      STORAGE_DRIVER: s3
      AWS_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadminpassword
      AWS_S3_BUCKET: transzact-pdf-documents
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_FORCE_PATH_STYLE: "true"
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/transzact_pdf
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NORMAL_WORKER_CONCURRENCY: 3
      LARGE_WORKER_CONCURRENCY: 0
      ARCHIVE_WORKER_CONCURRENCY: 0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1536M

  worker-large:
    build:
      context: .
      target: production
    container_name: transzact-worker-large
    restart: unless-stopped
    command: ["npm", "run", "start:worker"]
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      STORAGE_DRIVER: s3
      AWS_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadminpassword
      AWS_S3_BUCKET: transzact-pdf-documents
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_FORCE_PATH_STYLE: "true"
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/transzact_pdf
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NORMAL_WORKER_CONCURRENCY: 0
      LARGE_WORKER_CONCURRENCY: 1
      ARCHIVE_WORKER_CONCURRENCY: 0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1536M

  worker-archive:
    build:
      context: .
      target: production
    container_name: transzact-worker-archive
    restart: unless-stopped
    command: ["npm", "run", "start:worker"]
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      STORAGE_DRIVER: s3
      AWS_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadminpassword
      AWS_S3_BUCKET: transzact-pdf-documents
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_FORCE_PATH_STYLE: "true"
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/transzact_pdf
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NORMAL_WORKER_CONCURRENCY: 0
      LARGE_WORKER_CONCURRENCY: 0
      ARCHIVE_WORKER_CONCURRENCY: 2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1024M

volumes:
  postgres_data:
  redis_data:
  minio_data:
